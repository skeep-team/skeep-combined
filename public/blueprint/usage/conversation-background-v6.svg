<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1924 1266">
  <rect x="0" y="0" width="1924" height="1266" fill="#000000"/>
  <!-- 테두리(베젤): 원본 사진에서 실측한 값 그대로(outer radius ≈110.8, 두께 ≈28px).
       위쪽은 캔버스 밖(y=-400)까지 늘려서 원본처럼 위쪽 모서리는 잘려 보이지 않고
       아래 두 모서리만 둥글게 남는다. -->
  <rect x="361" y="-400" width="1195" height="1504" rx="110.8" ry="110.8" fill="#4E4E4E"/>
  <!-- 화면(채움): 색상만 conversation-icon-dark.mp4의 실측 배경색(#181818, rgb(24,24,24))으로
       맞췄다 — 그 위에 얹히는 아이콘 영상의 배경과 이어져 보이도록. -->
  <rect x="389" y="-400" width="1139" height="1476" rx="82.6" ry="82.6" fill="#181818"/>
</svg>
